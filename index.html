<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Silicon Maze: Doomsday Edition</title>

  <!-- Terminal Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23040806'/><text x='6' y='24' font-family='monospace' font-weight='bold' font-size='22' fill='%2335e05f'>L</text></svg>">

  <!-- Google Fonts: Chakra Petch (500, 700, 700i) & IBM Plex Mono (400, 500) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,700;1,700&family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
</head>
<body>

  <!-- Sticky Top Navigation -->
  <nav class="top-nav" aria-label="Main Navigation">
    <div class="nav-container">
      <!-- Left: brand logo link to #profile -->
      <a href="#profile" class="brand" aria-label="The Last Portfolio, home">
        <svg viewBox="0 0 296 98" aria-hidden="true">
          <defs>
            <linearGradient id="sil" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#f4f7f5"/>
              <stop offset=".3" stop-color="#c5d0c9"/>
              <stop offset=".5" stop-color="#8d9f94"/>
              <stop offset=".58" stop-color="#5d7466"/>
              <stop offset=".8" stop-color="#a9bbb0"/>
              <stop offset="1" stop-color="#d3ded6"/>
            </linearGradient>
            <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#e4ece7"/>
              <stop offset=".2" stop-color="#8d9f94"/>
              <stop offset=".45" stop-color="#35e05f"/>
              <stop offset="1" stop-color="#35e05f"/>
            </linearGradient>
          </defs>
          <path d="M55.2 13.4A30 30 0 1 0 38 68H290" fill="none" stroke="url(#arc)" stroke-width="3" stroke-linecap="round"/>
          <path d="M46.2 15.4A24 24 0 1 0 33.8 61.6" fill="none" stroke="#35e05f" stroke-width="1.2" stroke-linecap="round"/>
          <path d="M52 94H290" stroke="#35e05f" stroke-width="1.5" stroke-linecap="round"/>
          <g fill="url(#sil)" stroke="#0f3d1f" stroke-linejoin="round" paint-order="stroke fill" style="font-family:'Chakra Petch',system-ui,sans-serif;font-style:italic;font-weight:700">
            <text x="22" y="56" stroke-width="4.5" style="font-size:60px">L</text>
            <text x="51" y="56" stroke-width="3" textLength="236" lengthAdjust="spacingAndGlyphs" style="font-size:28px">AST PORTFOLIO</text>
          </g>
          <text x="96" y="86" textLength="150" lengthAdjust="spacing" fill="#35e05f" style="font:500 10px 'IBM Plex Mono',ui-monospace,monospace">SURVIVOR ARCHIVE</text>
        </svg>
      </a>

      <!-- Navigation Links -->
      <ul class="nav-links">
        <li><a href="#profile">Profile</a></li>
        <li><a href="#log">Log</a></li>
        <li><a href="#arsenal">Arsenal</a></li>
        <li><a href="#archives">Archives</a></li>
        <li><a href="#transmit">Contact</a></li>
      </ul>

      <!-- Far Right Network Status Indicator -->
      <div class="nav-status">
        <span class="pulse-dot" aria-hidden="true"></span>
        <span class="network-text">Network: 1 node online</span>
      </div>
    </div>
  </nav>

  <!-- Main Content Container with Five Base Sections -->
  <main class="container">
    <section id="profile"></section>
    <section id="log"></section>
    <section id="arsenal"></section>
    <section id="archives"></section>
    <section id="transmit"></section>
  </main>

</body>
</html>
