<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Silicon Maze: Doomsday Edition</title>

  <!-- Google Fonts: Chakra Petch (500, 700, 700i) & IBM Plex Mono (400, 500) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,700;1,700&family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
</head>
<body>

  <!-- Sticky Top Navigation -->
  <nav class="top-nav" aria-label="Main Navigation">
    <div class="nav-container">
      <!-- Left: brand logo placeholder -->
      <div class="brand-logo" id="brand-logo" aria-label="Brand Logo"></div>

      <!-- Navigation Links -->
      <ul class="nav-links">
        <li><a href="#profile">Profile</a></li>
        <li><a href="#log">Log</a></li>
        <li><a href="#arsenal">Arsenal</a></li>
        <li><a href="#archives">Archives</a></li>
        <li><a href="#transmit">Contact</a></li>
      </ul>

      <!-- Far Right Network Status Indicator -->
      <div class="nav-status">
        <span class="pulse-dot" aria-hidden="true"></span>
        <span class="network-text">Network: 1 node online</span>
      </div>
    </div>
  </nav>

  <!-- Main Content Container with Five Base Sections -->
  <main class="container">
    <section id="profile"></section>
    <section id="log"></section>
    <section id="arsenal"></section>
    <section id="archives"></section>
    <section id="transmit"></section>
  </main>

</body>
</html>
