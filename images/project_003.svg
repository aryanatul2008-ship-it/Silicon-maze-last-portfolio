<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%">
  <rect width="640" height="400" fill="#040806"/>
  
  <!-- Header -->
  <rect x="20" y="20" width="600" height="36" fill="#09130c" stroke="#1b3a25" stroke-width="1"/>
  <circle cx="38" cy="38" r="4" fill="#35e05f"/>
  <circle cx="52" cy="38" r="4" fill="#1b3a25"/>
  <circle cx="66" cy="38" r="4" fill="#1b3a25"/>
  <text x="86" y="42" fill="#84a68d" font-family="'IBM Plex Mono', monospace" font-size="11">SIGNAL_RADAR // FFT_SPECTROGRAM_SCANNER</text>
  <text x="530" y="42" fill="#9ad8a8" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="bold">SCANNING 142MHz</text>

  <!-- Spectrogram Display -->
  <rect x="20" y="70" width="410" height="300" fill="#09130c" stroke="#1b3a25" stroke-width="1"/>
  
  <!-- Equalizer Bars -->
  <g fill="#1b3a25">
    <rect x="40" y="280" width="12" height="70" fill="#35e05f" opacity="0.4"/>
    <rect x="60" y="240" width="12" height="110" fill="#35e05f" opacity="0.6"/>
    <rect x="80" y="200" width="12" height="150" fill="#35e05f" opacity="0.8"/>
    <rect x="100" y="160" width="12" height="190" fill="#35e05f"/>
    <rect x="120" y="220" width="12" height="130" fill="#35e05f" opacity="0.7"/>
    <rect x="140" y="270" width="12" height="80" fill="#35e05f" opacity="0.5"/>
    <rect x="160" y="290" width="12" height="60" fill="#35e05f" opacity="0.3"/>
    <rect x="180" y="180" width="12" height="170" fill="#35e05f" opacity="0.9"/>
    <rect x="200" y="130" width="12" height="220" fill="#35e05f"/>
    <rect x="220" y="150" width="12" height="200" fill="#9ad8a8"/>
    <rect x="240" y="230" width="12" height="120" fill="#35e05f" opacity="0.6"/>
    <rect x="260" y="280" width="12" height="70" fill="#35e05f" opacity="0.4"/>
    <rect x="280" y="260" width="12" height="90" fill="#35e05f" opacity="0.5"/>
    <rect x="300" y="210" width="12" height="140" fill="#35e05f" opacity="0.75"/>
    <rect x="320" y="170" width="12" height="180" fill="#35e05f"/>
    <rect x="340" y="240" width="12" height="110" fill="#35e05f" opacity="0.6"/>
    <rect x="360" y="290" width="12" height="60" fill="#35e05f" opacity="0.3"/>
    <rect x="380" y="310" width="12" height="40" fill="#35e05f" opacity="0.2"/>
  </g>

  <!-- Horizontal threshold line -->
  <line x1="30" y1="160" x2="420" y2="160" stroke="#9ad8a8" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="35" y="152" fill="#9ad8a8" font-family="'IBM Plex Mono', monospace" font-size="9">THRESHOLD ALERT +18dB</text>

  <!-- Side Telemetry -->
  <rect x="445" y="70" width="175" height="300" fill="#09130c" stroke="#1b3a25" stroke-width="1"/>
  <text x="460" y="96" fill="#e4f2e6" font-family="'Chakra Petch', sans-serif" font-size="12" font-weight="bold">RADAR TELEMETRY</text>
  <path d="M 460 108 L 605 108" stroke="#1b3a25" stroke-width="1"/>

  <text x="460" y="132" fill="#84a68d" font-family="'IBM Plex Mono', monospace" font-size="10">SOURCE: ATMOSPHERE</text>
  <text x="460" y="152" fill="#84a68d" font-family="'IBM Plex Mono', monospace" font-size="10">SAMPLING: 44.1kHz</text>
  <text x="460" y="172" fill="#84a68d" font-family="'IBM Plex Mono', monospace" font-size="10">FFT SIZE: 2048</text>
  <text x="460" y="192" fill="#35e05f" font-family="'IBM Plex Mono', monospace" font-size="10">DECODED: 3 PULSES</text>

  <rect x="460" y="225" width="145" height="125" fill="#040806" stroke="#1b3a25"/>
  <text x="470" y="250" fill="#9ad8a8" font-family="'IBM Plex Mono', monospace" font-size="9">&gt; start audio stream</text>
  <text x="470" y="270" fill="#84a68d" font-family="'IBM Plex Mono', monospace" font-size="9">&gt; analysing FFT...</text>
  <text x="470" y="290" fill="#35e05f" font-family="'IBM Plex Mono', monospace" font-size="9">&gt; spike intercepted</text>
  <text x="470" y="310" fill="#84a68d" font-family="'IBM Plex Mono', monospace" font-size="9">&gt; frequency logged</text>
</svg>
