<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%">
  <rect width="640" height="400" fill="#040806"/>
  <defs>
    <pattern id="grid2" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1b3a25" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="640" height="400" fill="url(#grid2)" opacity="0.4"/>

  <!-- Top bar -->
  <rect x="20" y="20" width="600" height="36" fill="#09130c" stroke="#1b3a25" stroke-width="1"/>
  <circle cx="38" cy="38" r="4" fill="#35e05f"/>
  <circle cx="52" cy="38" r="4" fill="#35e05f"/>
  <circle cx="66" cy="38" r="4" fill="#1b3a25"/>
  <text x="86" y="42" fill="#84a68d" font-family="'IBM Plex Mono', monospace" font-size="11">MAZE_NAVIGATOR // HEURISTIC_SOLVER_v2.4</text>
  <text x="540" y="42" fill="#35e05f" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="bold">PATH LOCKED</text>

  <!-- Canvas Labyrinth simulation -->
  <rect x="20" y="70" width="420" height="300" fill="#09130c" stroke="#1b3a25" stroke-width="1"/>
  
  <!-- Maze Walls -->
  <g stroke="#1b3a25" stroke-width="4" stroke-linecap="square">
    <path d="M 50 100 H 220 V 160 H 120 V 220 H 260 V 130 H 380"/>
    <path d="M 80 260 H 180 V 320 H 320 V 240 H 400"/>
    <path d="M 200 180 H 340 V 220 H 290 V 290"/>
    <path d="M 50 140 H 90 V 210 H 50"/>
  </g>

  <!-- Solved Path in Flare Green -->
  <path d="M 50 120 H 100 V 180 H 170 V 240 H 240 V 170 H 350 V 270 H 410" fill="none" stroke="#35e05f" stroke-width="3" stroke-dasharray="6 3"/>
  <circle cx="50" cy="120" r="5" fill="#9ad8a8"/>
  <circle cx="410" cy="270" r="6" fill="#35e05f"/>
  <text x="40" y="112" fill="#9ad8a8" font-family="'IBM Plex Mono', monospace" font-size="9">START</text>
  <text x="395" y="295" fill="#35e05f" font-family="'IBM Plex Mono', monospace" font-size="9" font-weight="bold">TARGET</text>

  <!-- Side Metrics -->
  <rect x="455" y="70" width="165" height="300" fill="#09130c" stroke="#1b3a25" stroke-width="1"/>
  <text x="470" y="96" fill="#e4f2e6" font-family="'Chakra Petch', sans-serif" font-size="12" font-weight="bold">PATH METRICS</text>
  <path d="M 470 108 L 605 108" stroke="#1b3a25" stroke-width="1"/>

  <text x="470" y="132" fill="#84a68d" font-family="'IBM Plex Mono', monospace" font-size="10">ALGORITHM: A*</text>
  <text x="470" y="152" fill="#84a68d" font-family="'IBM Plex Mono', monospace" font-size="10">OPEN NODES: 48</text>
  <text x="470" y="172" fill="#84a68d" font-family="'IBM Plex Mono', monospace" font-size="10">PATH LENGTH: 480px</text>
  <text x="470" y="192" fill="#35e05f" font-family="'IBM Plex Mono', monospace" font-size="10">COST: MINIMAL</text>
  <text x="470" y="212" fill="#84a68d" font-family="'IBM Plex Mono', monospace" font-size="10">FPS: 60.0</text>

  <rect x="470" y="235" width="135" height="115" fill="#040806" stroke="#1b3a25"/>
  <text x="478" y="260" fill="#35e05f" font-family="'IBM Plex Mono', monospace" font-size="9">&gt; compute route</text>
  <text x="478" y="280" fill="#84a68d" font-family="'IBM Plex Mono', monospace" font-size="9">&gt; grid: 40x40</text>
  <text x="478" y="300" fill="#84a68d" font-family="'IBM Plex Mono', monospace" font-size="9">&gt; obstacles: 12%</text>
  <text x="478" y="320" fill="#9ad8a8" font-family="'IBM Plex Mono', monospace" font-size="9">&gt; safe vector found</text>
</svg>
