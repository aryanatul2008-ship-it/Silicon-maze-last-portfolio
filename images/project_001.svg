<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%">
  <rect width="640" height="400" fill="#040806"/>
  <defs>
    <pattern id="grid1" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1b3a25" stroke-width="0.75"/>
    </pattern>
  </defs>
  <rect width="640" height="400" fill="url(#grid1)" opacity="0.6"/>
  
  <!-- Terminal Header -->
  <rect x="20" y="20" width="600" height="36" fill="#09130c" stroke="#1b3a25" stroke-width="1"/>
  <circle cx="38" cy="38" r="4" fill="#35e05f"/>
  <circle cx="52" cy="38" r="4" fill="#1b3a25"/>
  <circle cx="66" cy="38" r="4" fill="#1b3a25"/>
  <text x="86" y="42" fill="#84a68d" font-family="'IBM Plex Mono', monospace" font-size="11" letter-spacing="1">VAULT_KERNEL // SYS_PARTITION_01 [MOUNTED]</text>
  <text x="560" y="42" fill="#35e05f" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="bold">ONLINE</text>

  <!-- Graphic Window / Storage Blocks -->
  <rect x="20" y="70" width="380" height="300" fill="#09130c" stroke="#1b3a25" stroke-width="1"/>
  <text x="36" y="96" fill="#35e05f" font-family="'Chakra Petch', sans-serif" font-size="14" font-weight="bold">INDEXEDDB RECOVERY BLOCKS</text>
  
  <!-- Partition matrix -->
  <g fill="#1b3a25" stroke="#35e05f" stroke-width="0.5">
    <rect x="36" y="115" width="50" height="40" fill="#122b1c"/>
    <rect x="94" y="115" width="50" height="40" fill="#122b1c"/>
    <rect x="152" y="115" width="50" height="40" fill="#35e05f" opacity="0.8"/>
    <rect x="210" y="115" width="50" height="40" fill="#122b1c"/>
    <rect x="268" y="115" width="50" height="40" fill="#122b1c"/>
    <rect x="326" y="115" width="50" height="40" fill="#122b1c"/>

    <rect x="36" y="165" width="50" height="40" fill="#122b1c"/>
    <rect x="94" y="165" width="50" height="40" fill="#35e05f" opacity="0.6"/>
    <rect x="152" y="165" width="50" height="40" fill="#122b1c"/>
    <rect x="210" y="165" width="50" height="40" fill="#122b1c"/>
    <rect x="268" y="165" width="50" height="40" fill="#35e05f" opacity="0.8"/>
    <rect x="326" y="165" width="50" height="40" fill="#122b1c"/>

    <rect x="36" y="215" width="50" height="40" fill="#122b1c"/>
    <rect x="94" y="215" width="50" height="40" fill="#122b1c"/>
    <rect x="152" y="215" width="50" height="40" fill="#122b1c"/>
    <rect x="210" y="215" width="50" height="40" fill="#35e05f" opacity="0.9"/>
    <rect x="268" y="215" width="50" height="40" fill="#122b1c"/>
    <rect x="326" y="215" width="50" height="40" fill="#122b1c"/>
  </g>

  <!-- Side Telemetry Panel -->
  <rect x="415" y="70" width="205" height="300" fill="#09130c" stroke="#1b3a25" stroke-width="1"/>
  <text x="430" y="96" fill="#e4f2e6" font-family="'Chakra Petch', sans-serif" font-size="12" font-weight="bold">VAULT TELEMETRY</text>
  <path d="M 430 108 L 600 108" stroke="#1b3a25" stroke-width="1"/>
  
  <text x="430" y="130" fill="#84a68d" font-family="'IBM Plex Mono', monospace" font-size="10">INTEGRITY: 99.8%</text>
  <text x="430" y="150" fill="#84a68d" font-family="'IBM Plex Mono', monospace" font-size="10">PERSISTENCE: ACID</text>
  <text x="430" y="170" fill="#84a68d" font-family="'IBM Plex Mono', monospace" font-size="10">CORRUPTION: 0.00%</text>
  <text x="430" y="190" fill="#35e05f" font-family="'IBM Plex Mono', monospace" font-size="10">&gt; CACHE_SYNC_OK</text>
  
  <rect x="430" y="215" width="175" height="135" fill="#040806" stroke="#1b3a25"/>
  <text x="440" y="240" fill="#9ad8a8" font-family="'IBM Plex Mono', monospace" font-size="9">&gt; mount /dev/nvme0</text>
  <text x="440" y="260" fill="#84a68d" font-family="'IBM Plex Mono', monospace" font-size="9">&gt; scanning keys...</text>
  <text x="440" y="280" fill="#84a68d" font-family="'IBM Plex Mono', monospace" font-size="9">&gt; 10,482 items ok</text>
  <text x="440" y="300" fill="#35e05f" font-family="'IBM Plex Mono', monospace" font-size="9">&gt; daemon ready</text>
</svg>
